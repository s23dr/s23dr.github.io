<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S23DR — Structured Semantic 3D Reconstruction Challenges</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f3f4f6; color: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 10px; box-shadow: 0 0 0 1px #e5e7eb; padding: 40px 48px; max-width: 480px; width: 100%; }
    .logo { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, #22c55e 0%, #6366f1 100%); margin-bottom: 20px; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 28px; }
    .year-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .year-list li { display: flex; flex-direction: column; gap: 5px; }
    .year-list > li > a { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border: 1px solid #e5e7eb; border-radius: 8px; text-decoration: none; color: #1a1a1a; font-weight: 600; font-size: 14px; transition: border-color .15s, background .15s; }
    .year-list > li > a:hover { border-color: #6366f1; background: #f5f3ff; }
    .year-list .badge { font-size: 11px; font-weight: 500; color: #6b7280; background: #f3f4f6; padding: 2px 8px; border-radius: 20px; }
    .year-list .badge.workshop { color: #0369a1; background: #e0f2fe; }
    .year-slides { display: flex; gap: 6px; padding: 0 4px; }
    .year-slides a { font-size: 11px; color: #6b7280; text-decoration: none; padding: 2px 10px; border: 1px solid #e5e7eb; border-radius: 4px; transition: border-color .15s, color .15s; }
    .year-slides a:hover { border-color: #6366f1; color: #6366f1; }
    .year-slides-label { font-size: 11px; color: #9ca3af; align-self: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <h1>S23DR Challenges</h1>
    <p class="subtitle">Structured Semantic 3D Reconstruction &mdash; CVPR Workshop Series</p>
    <ul class="year-list">
      <li>
        <a href="2025/">
          S23DR 2025
          <span class="badge workshop">CVPR 2025 · archived</span>
        </a>
      </li>
      <li>
        <a href="2024/">
          S23DR 2024
          <span class="badge">CVPR 2024 · archived</span>
        </a>
        <div class="year-slides">
          <span class="year-slides-label">Slides:</span>
          <a href="https://docs.google.com/presentation/d/1I3OB30aXegpn4BSm2O2hf3uhsCsJdCWQJjChgxYFLyo/edit?usp=sharing" target="_blank">2024</a>
          <a href="https://docs.google.com/presentation/d/1x_CTtbUFRZ69TTtuLjpezR6-m1axSUe59d4sQXtVC8Q/edit?usp=sharing" target="_blank">2025</a>
        </div>
      </li>
    </ul>
  </div>
</body>
</html>
